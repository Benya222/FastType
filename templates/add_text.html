<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="container container--header">
        <a href="#" class="logo link">FastType</a>
        <div class="auth">
          {% if logged %}
          <a href="{{ url_for('logout') }}" class="auth__btn link">Log out</a>
          {% else %}
          <a href="{{ url_for('login') }}" class="auth__btn link">Log in</a>
          <a href="{{ url_for('register') }}" class="auth__btn link">Register</a>
          {% endif %}
        </div>        
      </div>
    </header>
    <main>
      <form method="post">
        <label for="title">Title:</label>
        <input type="text" name="title" id="title">
        <label for="text">Text:</label>
        <textarea name="text" id="text"></textarea>
        <button type="submit">Add</button>
      </form>
    </main>
  </body>
</html>
