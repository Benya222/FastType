{% extends "base.html" %}


{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename= 'css/manage_text.css') }}">
{% endblock %}

{% block page_title %}Edit{% endblock %}

{% block main_content %}
<h1 class="title">Edit</h1>
<form method="post" class="manage-form">
  <label>
    <span class="manage-form__text">Title</span>
    <input type="text" name="title" class="manage-form__input" placeholder="Title..." value="{{ current_title }}">
  </label>
  <label>
    <span class="manage-form__text">Text</span>
    <textarea name="text" class="manage-form__textarea" placeholder="Text..." spellcheck="false">{{ current_text }}</textarea>
  </label>
  <button type="submit" class="btn">Edit</button>
</form>     
{% endblock %}
