{% extends "base.html" %}


{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename= 'css/auth.css') }}">
{% endblock %}

{% block page_title %}Login{% endblock %}

{% block main_content %}
<h1 class="title">Login</h1>
<form class="auth-form" method="post">
  <label class="auth-form__label">
    <span class="auth-form__text">Name</span>
    <input type="text" name="name" class="auth-form__input" placeholder="Name...">
  </label>

  <label class="auth-form__label">
    <span class="auth-form__text">Password</span>
    <input type="password" name="password" class="auth-form__input" placeholder="Password...">
  </label>
  

  <button type="submit" class="btn">Login</button>
</form>
{% endblock %}
